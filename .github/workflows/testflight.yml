name: Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: testflight-deploy
  cancel-in-progress: false

jobs:
  test-padel-kit:
    name: Test PadelKit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Run PadelKit unit tests
        working-directory: Packages/PadelKit
        run: swift test

  deploy:
    name: Build & Upload to TestFlight
    needs: test-padel-kit
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_DISPLAY_NAME: ${{ vars.APP_DISPLAY_NAME }}
      APP_BUNDLE_IDENTIFIER: ${{ vars.APP_BUNDLE_IDENTIFIER }}
      WATCH_APP_BUNDLE_IDENTIFIER: ${{ vars.WATCH_APP_BUNDLE_IDENTIFIER }}
      WIDGET_BUNDLE_IDENTIFIER: ${{ vars.WIDGET_BUNDLE_IDENTIFIER }}
      WATCH_WIDGET_BUNDLE_IDENTIFIER: ${{ vars.WATCH_WIDGET_BUNDLE_IDENTIFIER }}
      ICLOUD_CONTAINER_IDENTIFIER: ${{ vars.ICLOUD_CONTAINER_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate deployment configuration
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          missing=()
          for name in \
            APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 \
            APPLE_TEAM_ID APP_DISPLAY_NAME APP_BUNDLE_IDENTIFIER WATCH_APP_BUNDLE_IDENTIFIER \
            WIDGET_BUNDLE_IDENTIFIER WATCH_WIDGET_BUNDLE_IDENTIFIER ICLOUD_CONTAINER_IDENTIFIER; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions Secret/Variable(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Generate app icons
        run: python3 scripts/generate_app_icons.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec fastlane beta

      - name: Remove temporary API key
        if: always()
        shell: bash
        run: rm -f "${APP_STORE_CONNECT_API_KEY_PATH:-}"
